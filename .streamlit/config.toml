# PayWatch dashboard theme: validated blue as the primary colour, warm-neutral surfaces, light and dark.
[theme]
primaryColor = "#2a78d6"
font = "sans serif"

[theme.light]
backgroundColor = "#f9f9f7"
secondaryBackgroundColor = "#f0efec"
textColor = "#0b0b0b"
primaryColor = "#2a78d6"

[theme.dark]
backgroundColor = "#0d0d0d"
secondaryBackgroundColor = "#1a1a19"
textColor = "#f0efec"
primaryColor = "#3987e5"

[browser]
gatherUsageStats = false
